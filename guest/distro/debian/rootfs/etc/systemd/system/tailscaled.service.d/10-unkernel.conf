[Unit]
Wants=kw-net.service
After=kw-net.service

[Service]
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS --tun=userspace-networking --socks5-server=127.0.0.1:1055
ExecStopPost=
